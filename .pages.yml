media:
  - name: documents
    label: Dokumenty
    input: media/docs
    output: media/docs
    extensions: [pdf]
    categories: [document]
    rename: safe

content:
  - name: homepage
    label: Obsah webu Uki
    type: file
    path: content/site.json
    format: json
    fields:
      - name: anotace
        label: Anotace knihy
        type: rich-text
        required: true
        description: Text anotace zobrazený na stránce O knize.
        options:
          format: html
          media: false
          switcher: false

      - name: ukazka_pdf
        label: Ukázka knihy (PDF)
        type: file
        description: Nahraj aktuální PDF ukázku. Staré PDF můžeš později v médiích smazat.
        options:
          media: documents
          extensions: [pdf]
          rename: safe

      - name: ukazka_popisek
        label: Krátký popisek ukázky
        type: text
        required: false
        description: Nepovinná krátká věta pod nadpisem Ukázka z knihy.
