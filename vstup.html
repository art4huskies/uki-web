<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#081720">
  <title>Vstup do Sillanmaa — Uki</title>
  <link rel="stylesheet" href="style.css?v=6">
  <link rel="stylesheet" href="button-bookmarks.css?v=2">
</head>
<body class="vstup-page">
<main class="screen" aria-labelledby="entry-title">
  <div class="entry-snow" aria-hidden="true"></div>
  <div class="entry-fog" aria-hidden="true"><span class="entry-fog__bank"></span></div>
  <div class="motto">
    <div class="uki-rune" aria-hidden="true"></div>
    <h1 class="entry-motto-first" id="entry-title">Můžeš se bát…</h1>
    <a class="entry-next" id="entry-next" href="sillanmaa.html?entry=fog" aria-disabled="true" tabindex="-1">…a jít dál.</a>
  </div>
</main>
<script>
(function(){
  const body=document.body,next=document.getElementById('entry-next');
  if(!next)return;
  body.classList.add('js');
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const snow=document.querySelector('.entry-snow');
  if(snow){
    const addFlake=(initial=false)=>{
      const flake=document.createElement('span');
      flake.className='snowflake';
      const duration=10+Math.random()*13;
      flake.style.setProperty('--snow-x',(Math.random()*100)+'vw');
      flake.style.setProperty('--snow-size',(1.3+Math.random()*3.1)+'px');
      flake.style.setProperty('--snow-alpha',(0.32+Math.random()*0.48).toFixed(2));
      flake.style.setProperty('--snow-drift',((Math.random()*150)-75).toFixed(0)+'px');
      flake.style.setProperty('--snow-duration',duration.toFixed(1)+'s');
      flake.style.setProperty('--snow-delay',initial?(-Math.random()*duration).toFixed(1)+'s':'0s');
      if(reduced){
        flake.classList.add('is-static');
        flake.style.setProperty('--snow-y',(Math.random()*92)+'vh');
      }else{
        flake.addEventListener('animationend',()=>{
          flake.remove();
          window.setTimeout(()=>addFlake(),400+Math.random()*1300);
        },{once:true});
      }
      snow.appendChild(flake);
    };
    for(let i=0;i<(reduced?12:20);i++)addFlake(true);
  }
  const reveal=()=>{
    next.classList.add('is-visible');
    window.setTimeout(()=>{
      next.classList.add('is-ready');
      next.removeAttribute('aria-disabled');
      next.removeAttribute('tabindex');
    },reduced?0:720);
  };
  window.setTimeout(reveal,reduced?0:2500);
  next.addEventListener('click',function(event){
    if(next.getAttribute('aria-disabled')==='true'){event.preventDefault();return;}
    event.preventDefault();
    body.classList.add('is-leaving');
    try{sessionStorage.setItem('uki-fog-arrival','1')}catch(e){}
    window.setTimeout(()=>{window.location.href=next.href},reduced?0:360);
  });
})();
</script>
</body>
</html>
